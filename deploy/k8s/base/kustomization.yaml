apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: feedbackflow
labels:
  - pairs:
      app.kubernetes.io/part-of: feedbackflow
    includeSelectors: false
resources:
  - namespace.yaml
  - configmap.yaml
  - app.yaml
  - notifier.yaml
  - ingress.yaml
# The Secret `feedbackflow-secrets` is supplied by each overlay (see overlays/local).
