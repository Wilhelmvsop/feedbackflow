apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    app.kubernetes.io/name: feedbackflow-app
spec:
  # One replica: analysis runs in-process and the rate limiter is per-process (see README "Known limitations").
  # Migrations take a Postgres advisory lock, so scaling up is safe for the schema.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: feedbackflow-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: feedbackflow-app
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: feedbackflow-app
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: feedbackflow-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: feedbackflow-secrets, key: DATABASE_URL }
            - name: DEMO_PASSWORD
              valueFrom:
                secretKeyRef: { name: feedbackflow-secrets, key: DEMO_PASSWORD }
            - name: NOTIFIER_TOKEN
              valueFrom:
                secretKeyRef: { name: feedbackflow-secrets, key: NOTIFIER_TOKEN }
            - name: AI_API_KEY
              valueFrom:
                secretKeyRef: { name: feedbackflow-secrets, key: AI_API_KEY, optional: true }
          # Startup covers migrations; readiness checks the database; liveness only the process,
          # so a database outage takes pods out of the Service without restarting them.
          startupProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /api/health/live, port: http }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: app
  labels:
    app.kubernetes.io/name: feedbackflow-app
spec:
  selector:
    app.kubernetes.io/name: feedbackflow-app
  ports:
    - name: http
      port: 80
      targetPort: http
