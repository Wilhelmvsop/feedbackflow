# Local cluster (kind): in-cluster PostgreSQL, locally built images, and a webhook echo receiver.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: feedbackflow
resources:
  - ../../base
  - postgres.yaml
  - webhook-echo.yaml
images:
  - name: feedbackflow-app
    newName: feedbackflow-app
    newTag: local
  - name: feedbackflow-notifier
    newName: feedbackflow-notifier
    newTag: local
# Generated by ../../kind-up.sh on first run (never committed). Produces the `feedbackflow-secrets` Secret.
secretGenerator:
  - name: feedbackflow-secrets
    envs:
      - secrets.env
generatorOptions:
  disableNameSuffixHash: true
patches:
  - target:
      kind: ConfigMap
      name: feedbackflow-config
    patch: |-
      - op: replace
        path: /data/CORS_ORIGINS
        value: http://localhost:8080
  # kind loads images into the node; never try to pull them from a registry.
  - target:
      kind: Deployment
      name: (app|notifier)
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
