# Stand-in webhook target that logs every request: `kubectl -n feedbackflow logs deploy/webhook-echo`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-echo
  labels:
    app.kubernetes.io/name: webhook-echo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: webhook-echo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: webhook-echo
    spec:
      containers:
        - name: echo
          image: mendhak/http-https-echo:40
          env:
            - name: HTTP_PORT
              value: "8080"
            - name: LOG_IGNORE_PATH
              value: /healthz
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: webhook-echo
spec:
  selector:
    app.kubernetes.io/name: webhook-echo
  ports:
    - name: http
      port: 80
      targetPort: http
