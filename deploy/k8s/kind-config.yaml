# kind create cluster --name feedbackflow --config deploy/k8s/kind-config.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    # Ingress controller reachable at http://localhost:8080 on the host.
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
