services:
  - type: web
    name: feedbackflow
    runtime: docker
    plan: free
    region: ohio
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: feedbackflow-db
          property: connectionString
      - key: DEMO_PASSWORD
        sync: false

  - type: web
    name: feedbackflow-mcp
    runtime: docker
    plan: free
    region: ohio
    dockerCommand: python -m app.mcp_server
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: feedbackflow-db
          property: connectionString
      # The main service owns migrations and demo seeding.
      - key: AUTO_MIGRATE
        value: "false"
      - key: SEED_DEMO
        value: "false"
      - key: MCP_HOST
        value: 0.0.0.0
      - key: MCP_ACCESS_TOKEN
        generateValue: true

databases:
  - name: feedbackflow-db
    databaseName: feedbackflow
    user: feedbackflow
    plan: free
    region: ohio
    postgresMajorVersion: "16"
    ipAllowList: []
