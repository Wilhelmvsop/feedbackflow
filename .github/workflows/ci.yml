name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on main midway through a deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: feedbackflow
          POSTGRES_PASSWORD: feedbackflow
          POSTGRES_DB: feedbackflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U feedbackflow" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov --cov-report=term-missing
      - name: Migrations apply cleanly on PostgreSQL
        env:
          DATABASE_URL: postgresql://feedbackflow:feedbackflow@localhost:5432/feedbackflow
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  notifier:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/notifier
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/notifier/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --coverage
      - run: npm run build

  kubernetes:
    name: kind e2e
    runs-on: ubuntu-latest
    needs: [backend, frontend, notifier]
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with:
          cluster_name: feedbackflow
          config: deploy/k8s/kind-config.yaml
      # Builds both images, deploys the local overlay behind ingress-nginx, and checks that a widget
      # submission travels API -> notifier -> webhook.
      - run: deploy/k8s/kind-up.sh
      - name: Diagnostics
        if: failure()
        run: |
          kubectl -n feedbackflow get pods,svc,ingress -o wide
          kubectl -n feedbackflow describe pods | tail -n 80
          kubectl -n feedbackflow logs deploy/app --tail=100 || true
          kubectl -n feedbackflow logs deploy/notifier --tail=100 || true

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: [kubernetes]
    # Runs once deploy/azure/bootstrap.sh has created the infrastructure and set the repository variables.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.AZURE_CLIENT_ID != ''
    permissions:
      contents: read
      id-token: write  # OIDC token exchanged for an Azure access token; no stored credentials
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      APP_IMAGE: ${{ vars.ACR_NAME }}.azurecr.io/feedbackflow-app:${{ github.sha }}
      NOTIFIER_IMAGE: ${{ vars.ACR_NAME }}.azurecr.io/feedbackflow-notifier:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push images to ACR
        # OCI media types: Container Apps fails to provision revisions from Docker v2 layer media types.
        run: |
          az acr login --name "${{ vars.ACR_NAME }}"
          build() {  # build <image> <context> <cache scope>
            docker buildx build --provenance=false --output type=image,push=true,oci-mediatypes=true \
              --cache-from "type=gha,scope=$3" --cache-to "type=gha,mode=max,scope=$3" -t "$1" "$2"
          }
          build "$APP_IMAGE" . app
          build "$NOTIFIER_IMAGE" services/notifier notifier
      - name: Roll out new revisions
        run: |
          az containerapp update -g "${{ vars.AZURE_RESOURCE_GROUP }}" -n "${{ vars.AZURE_NOTIFIER_NAME }}" --image "$NOTIFIER_IMAGE" -o none
          az containerapp update -g "${{ vars.AZURE_RESOURCE_GROUP }}" -n "${{ vars.AZURE_APP_NAME }}" --image "$APP_IMAGE" -o none
      - name: Smoke test
        run: |
          fqdn=$(az containerapp show -g "${{ vars.AZURE_RESOURCE_GROUP }}" -n "${{ vars.AZURE_APP_NAME }}" --query properties.configuration.ingress.fqdn -o tsv)
          for i in $(seq 30); do
            if curl -fsS --max-time 20 "https://$fqdn/api/health"; then echo; echo "Deployed ${{ github.sha }} to https://$fqdn"; exit 0; fi
            sleep 10
          done
          echo "Health check failed"; exit 1
