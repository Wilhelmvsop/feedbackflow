services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: feedbackflow
      POSTGRES_USER: feedbackflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-feedbackflow}
    volumes:
      - feedbackflow-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feedbackflow -d feedbackflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://feedbackflow:${POSTGRES_PASSWORD:-local-feedbackflow}@db:5432/feedbackflow
      # The image defaults to APP_ENV=production, which refuses the default demo password.
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Set DEMO_PASSWORD in .env or your shell}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-gpt-4.1-mini}
      NOTIFIER_URL: http://notifier:8002
      NOTIFIER_TOKEN: ${NOTIFIER_TOKEN:-local-notifier-token}
    depends_on:
      db:
        condition: service_healthy
      notifier:
        condition: service_healthy

  notifier:
    build: services/notifier
    environment:
      NOTIFIER_TOKEN: ${NOTIFIER_TOKEN:-local-notifier-token}
      # Comma-separated webhook URLs; empty means events are accepted and logged but not delivered.
      WEBHOOK_URLS: ${WEBHOOK_URLS:-}
      WEBHOOK_FORMAT: ${WEBHOOK_FORMAT:-json}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}

  mcp:
    build: .
    profiles: ["mcp"]
    command: ["python", "-m", "app.mcp_server"]
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql+psycopg://feedbackflow:${POSTGRES_PASSWORD:-local-feedbackflow}@db:5432/feedbackflow
      AUTO_MIGRATE: "false"
      SEED_DEMO: "false"
      MCP_HOST: 0.0.0.0
      MCP_ACCESS_TOKEN: ${MCP_ACCESS_TOKEN:?Set MCP_ACCESS_TOKEN to run the MCP profile}
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_healthy

volumes:
  feedbackflow-data:
